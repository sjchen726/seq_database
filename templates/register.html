<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BPRdb — 注册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="/static/css/design-system.css" rel="stylesheet">
</head>
<body class="ds-standalone-body">
<div class="ds-standalone-card">
  <div class="ds-standalone-logo">
    <div class="ds-logo-mark">B</div>
    <div>
      <div class="ds-logo-text">BPRdb</div>
      <div class="ds-logo-tagline">实验数据管理库</div>
    </div>
  </div>
  <div class="ds-standalone-title">注册账号</div>
  <div class="ds-standalone-sub">注册即可开始使用，填写项目代码自动获得权限</div>

  {% if error %}
  <div class="ds-alert ds-alert-error" style="margin-bottom:14px;">{{ error }}</div>
  {% endif %}

  <form method="post" action="/register/">
    {% csrf_token %}
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px;" for="username">
        <i class="bi bi-person"></i> 用户名
      </label>
      <input type="text" class="ds-form-control" id="username" name="username"
             value="{{ username|default:'' }}"
             placeholder="请输入用户名" required style="width:100%;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px;" for="password">
        <i class="bi bi-lock"></i> 密码（至少 6 位）
      </label>
      <input type="password" class="ds-form-control" id="password" name="password"
             placeholder="请输入密码" required minlength="6" style="width:100%;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px;" for="confirm_password">
        <i class="bi bi-lock-fill"></i> 确认密码
      </label>
      <input type="password" class="ds-form-control" id="confirm_password" name="confirm_password"
             placeholder="再次输入密码" required style="width:100%;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px;" for="project_code">
        <i class="bi bi-folder2"></i> 项目代码 <span style="color:#94a3b8;font-weight:400;">（可选）</span>
      </label>
      <input type="text" class="ds-form-control" id="project_code" name="project_code"
             placeholder="如 BPR350、BPR3T05" style="width:100%;box-sizing:border-box;">
      <div style="font-size:11px;color:#94a3b8;margin-top:4px;">填写后自动获得该项目的完整操作权限，无需等待审批</div>
    </div>
    <button type="submit" class="ds-btn ds-btn-primary" style="width:100%;justify-content:center;">注册</button>
  </form>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:#64748b;">
    已有账户？<a href="/login/" style="color:#2563eb;text-decoration:none;font-weight:500;">登录</a>
  </div>
</div>
</body>
</html>
