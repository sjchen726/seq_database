// ── helpers ──────────────────────────────────────────────────────────────────
function bandDatasets(tps, color, label, lineDash) {
  const xs   = tps.map(t => t.time);
  const up   = tps.map(t => +(t.mean + t.sd).toFixed(2));
  const dn   = tps.map(t => +(t.mean - t.sd).toFixed(2));
  const mean = tps.map(t => t.mean);
  const alpha = '26';  // 15% opacity for band
  return [
    // upper band (fill to lower)
    { label: null, data: up.map((y,i)=>({x:xs[i],y})), borderWidth:0,
      backgroundColor: color + alpha, pointRadius:0, fill: '+1',
      tension:0.3, showInLegend:false },
    // lower band
    { label: null, data: dn.map((y,i)=>({x:xs[i],y})), borderWidth:0,
      backgroundColor: color + alpha, pointRadius:0, fill: false,
      tension:0.3 },
    // mean line
    { label, data: mean.map((y,i)=>({x:xs[i],y})),
      borderColor: color, borderWidth: 2,
      borderDash: lineDash || [],
      backgroundColor: 'transparent',
      pointRadius:0, pointHoverRadius:4,
      tension:0.3, fill:false },
  ];
}

function makeChart(canvasId, groups, yMin, yMax) {
  const datasets = [];
  groups.forEach(g => datasets.push(...bandDatasets(g.tps, g.color, g.label, g.dash)));

  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: item => item.dataset.label != null,
          callbacks: {
            label: ctx => {
              const g = groups.find(g => g.label === ctx.dataset.label);
              if (!g) return '';
              const tp = g.tps.find(t => t.time === ctx.parsed.x);
              if (!tp) return `${ctx.dataset.label}: ${ctx.parsed.y}`;
              return `${ctx.dataset.label}: ${tp.mean.toFixed(1)} ± ${tp.sd.toFixed(1)} g`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: '时间（天）', font:{size:11}, color:'#64748b' },
          ticks: { font:{size:10}, color:'#94a3b8', maxTicksLimit:12 },
          grid: { color:'#f1f5f9' },
        },
        y: {
          min: yMin, max: yMax,
          title: { display: true, text: '体重（g）', font:{size:11}, color:'#64748b' },
          ticks: { font:{size:10}, color:'#94a3b8' },
          grid: { color:'#f1f5f9' },
        }
      }
    }
  });
}
